<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Identidade TiPCA Lab</title>
  <meta name="description" content="Identidade visual compacta do TiPCA Lab.">
  <style>
    :root {
      --purple: #55206f;
      --purple-light: #9c79bc;
      --purple-soft: #f4eff8;
      --line: #e8dfef;
      --ink: #33243d;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: transparent; }

    body {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      color: var(--ink);
      padding: 6px;
    }

    .identity {
      width: min(100%, 1140px);
      min-height: 176px;
      margin: 0 auto;
      padding: 18px 34px;
      display: grid;
      grid-template-columns: minmax(350px, 520px) 1fr;
      align-items: center;
      gap: clamp(28px, 6vw, 92px);
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(74, 40, 94, .08);
      overflow: hidden;
      position: relative;
    }

    .identity::after {
      content: "";
      position: absolute;
      right: -84px;
      bottom: -118px;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      background: var(--purple-soft);
      opacity: .72;
      pointer-events: none;
    }

    .brand {
      min-width: 0;
      position: relative;
      z-index: 1;
    }

    .brand img {
      display: block;
      width: min(100%, 500px);
      max-height: 150px;
      object-fit: contain;
      object-position: left center;
    }

    .signature {
      position: relative;
      z-index: 1;
      padding-left: clamp(20px, 3vw, 42px);
      border-left: 2px solid var(--purple-soft);
    }

    .signature-label {
      display: block;
      margin-bottom: 8px;
      color: var(--purple);
      font-size: .72rem;
      font-weight: 800;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .signature h1 {
      margin: 0;
      color: var(--purple-light);
      font-size: clamp(1.25rem, 2.45vw, 2rem);
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: .035em;
      text-transform: uppercase;
    }

    .research-line {
      margin-top: 12px;
      color: #715b80;
      font-size: clamp(.78rem, 1.25vw, .92rem);
      line-height: 1.45;
      max-width: 520px;
    }

    @media (max-width: 760px) {
      body { padding: 4px; }
      .identity {
        min-height: 0;
        grid-template-columns: 1fr;
        gap: 14px;
        padding: 22px 20px;
        text-align: center;
      }
      .brand img {
        width: min(100%, 430px);
        max-height: 142px;
        margin: 0 auto;
        object-position: center;
      }
      .signature {
        padding: 14px 0 0;
        border-left: 0;
        border-top: 2px solid var(--purple-soft);
      }
      .signature h1 { font-size: clamp(1.05rem, 5vw, 1.5rem); }
      .research-line { margin: 10px auto 0; }
    }

    @media (max-width: 430px) {
      .identity { padding: 18px 15px; border-radius: 12px; }
      .brand img { max-height: 120px; }
      .signature-label { font-size: .66rem; }
      .research-line { font-size: .78rem; }
    }
  </style>
</head>
