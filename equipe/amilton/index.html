<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amilton Carlos Rattmann | TiPCA Lab</title>
  <meta name="description" content="Página pessoal de Amilton Carlos Rattmann no TiPCA Lab.">
  <style>
    :root { --purple:#5b3a7d; --purple-dark:#3b2354; --purple-soft:#f2ecf7; --ink:#28313b; --muted:#64748b; --line:#e2e8f0; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:#f8f9fa; }
    main { width:min(100%,720px); background:#fff; border:1px solid var(--line); border-top:5px solid var(--purple); border-radius:14px; padding:38px; box-shadow:0 12px 34px rgba(67,39,89,.10); text-align:center; }
    .label { color:var(--purple); font-size:.76rem; font-weight:800; letter-spacing:.09em; text-transform:uppercase; margin-bottom:10px; }
    h1 { color:var(--purple-dark); font-size:clamp(1.7rem,4vw,2.4rem); line-height:1.2; margin-bottom:16px; }
    .status { display:inline-block; margin:4px 0 18px; padding:7px 12px; border-radius:999px; background:var(--purple-soft); color:var(--purple); font-weight:800; font-size:.82rem; }
    p { color:var(--muted); max-width:560px; margin:0 auto 24px; line-height:1.65; }
    a { display:inline-flex; align-items:center; justify-content:center; padding:11px 16px; border-radius:8px; background:var(--purple); color:#fff; text-decoration:none; font-weight:750; }
    a:hover, a:focus-visible { background:var(--purple-dark); outline:none; }
    @media(max-width:480px) { main { padding:28px 20px; } a { width:100%; } }
  </style>
</head>
<body>
  <main>
    <div class="label">TiPCA Lab · Equipe</div>
    <h1>Amilton Carlos Rattmann</h1>
    <div class="status">Em construção</div>
    <p>Esta página está em construção. Em breve, este espaço reunirá informações sobre atuação em pesquisa, projetos, produção científica e recursos relacionados ao TiPCA Lab.</p>
    <a href="../">← Voltar para a equipe</a>
  </main>
</body>
</html>
